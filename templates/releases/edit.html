{% extends "base.html" %}
{% block title %}Edit Release: {{ release.name }} — IntelliTrack{% endblock %}
{% block breadcrumb %}
<a href="{{ url_for('releases.list_releases') }}" class="breadcrumb-item">Releases</a>
<span class="breadcrumb-sep">/</span>
<a href="{{ url_for('releases.view_release', release_id=release.id) }}" class="breadcrumb-item">{{ release.name }}</a>
<span class="breadcrumb-sep">/</span>
<span class="breadcrumb-item">Edit</span>
{% endblock %}

{% block page_title %}Edit Release: {{ release.name }}{% endblock %}

{% block content %}
<div class="card" style="max-width:640px">
    <div class="card-body">
        <form method="POST" action="{{ url_for('releases.edit_release', release_id=release.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label">Project</label>
                <input type="text" class="form-input" value="{{ release.project.name }} ({{ release.project.key }})" disabled>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex:2">
                    <label class="form-label" for="name">Release Name *</label>
                    <input type="text" id="name" name="name" class="form-input" value="{{ release.name }}" required>
                </div>
                <div class="form-group" style="flex:1">
                    <label class="form-label" for="version">Version</label>
                    <input type="text" id="version" name="version" class="form-input" value="{{ release.version or '' }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="status">Status</label>
                    <select id="status" name="status" class="form-select">
                        {% for s in valid_statuses %}
                        <option value="{{ s }}" {{ 'selected' if release.status == s }}>{{ s|replace('_',' ')|title }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="release_date">Target Release Date</label>
                    <input type="date" id="release_date" name="release_date" class="form-input" value="{{ release.release_date.strftime('%Y-%m-%d') if release.release_date else '' }}">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="description">Description</label>
                <textarea id="description" name="description" class="form-textarea" rows="4">{{ release.description or '' }}</textarea>
            </div>

            <div style="display:flex;gap:8px;margin-top:16px">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('releases.view_release', release_id=release.id) }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
